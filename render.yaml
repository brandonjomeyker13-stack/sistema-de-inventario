services:
  - type: web
    name: norbox-api
    # `runtime` es la clave actual; `env` era el nombre viejo y sigue
    # funcionando, pero conviene no quedarse en el deprecado.
    runtime: python
    plan: free
    # Render considera el servicio vivo cuando esta ruta responde 200. Sin
    # esto solo comprueba que el puerto esté abierto, y un arranque que
    # falla a medias (por ejemplo, una migración rota) podría darse por
    # bueno.
    healthCheckPath: /
    buildCommand: "pip install -r requirements.txt"
    # Las migraciones corren antes de levantar la API. Va en el
    # startCommand y no en el buildCommand porque el build de Render se
    # cachea y puede no volver a ejecutarse en un redeploy. Si no hay
    # migraciones pendientes, `upgrade head` es un no-op de milisegundos.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Fijar la versión evita que Render cambie de Python por su cuenta
      # y te rompa un deploy que ayer funcionaba. Es la misma que usas en
      # local, así que lo que pruebas es lo que se despliega.
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      # Sin esto el servidor usaría UTC y las ventas de la noche caerían
      # en el día siguiente. Ver app/core/fechas.py.
      - key: ZONA_HORARIA
        value: America/Bogota