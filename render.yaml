services:
  - type: web
    name: norbox-api
    # `runtime` es la clave actual; `env` era el nombre viejo y sigue
    # funcionando, pero conviene no quedarse en el deprecado.
    runtime: python
    # OJO al pagar: si subes el plan desde el panel pero esta línea sigue
    # diciendo `free`, una sincronización del Blueprint puede devolverte al
    # plan gratuito — y con él, el servicio durmiéndose a los 15 minutos.
    # Cambia esto a `starter` EN EL MISMO MOMENTO en que pagues.
    plan: free
    # Render considera el servicio vivo cuando esta ruta responde 200. Sin
    # esto solo comprueba que el puerto esté abierto, y un arranque que
    # falla a medias (por ejemplo, una migración rota) podría darse por
    # bueno.
    healthCheckPath: /
    buildCommand: "pip install -r requirements.txt"
    # Las migraciones corren antes de levantar la API. Va en el
    # startCommand y no en el buildCommand porque el build de Render se
    # cachea y puede no volver a ejecutarse en un redeploy. Si no hay
    # migraciones pendientes, `upgrade head` es un no-op de milisegundos.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Fijar la versión evita que Render cambie de Python por su cuenta
      # y te rompa un deploy que ayer funcionaba. Es la misma que usas en
      # local, así que lo que pruebas es lo que se despliega.
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      # Los orígenes del frontend no son un secreto, así que van aquí y
      # no en el panel: con `sync: false` bastaba con que nadie hubiera
      # rellenado la variable en Render para que el navegador bloqueara
      # todas las llamadas desde stocktraking.com — y el frontend solo
      # vería un error de CORS, que no dice qué falta configurar.
      #
      # Con esquema y sin barra final: es como manda el navegador la
      # cabecera `Origin`, y así se compara. Se incluye el subdominio de
      # Lovable porque sigue siendo la vista previa del frontend.
      - key: CORS_ORIGINS
        value: https://stocktraking.com,https://www.stocktraking.com,https://stocktrack-ai.lovable.app
      # Todas estas son secretas: se ponen en el dashboard de Render, no
      # en este archivo. Ver .env.ejemplo para saber de dónde sale cada una.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      # Dominio propio. Iba fijo al de lovable.app, y como está declarado
      # con `value` y no con `sync: false`, una sincronización del
      # Blueprint le pisaba el valor puesto a mano en el panel — y los
      # correos de verificación y de recuperar contraseña volvían a
      # apuntar al dominio viejo sin ningún error visible.
      - key: URL_FRONTEND
        value: https://stocktraking.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Empieza en false. Actívalo solo cuando confirmes que los correos
      # llegan: si no, nadie podrá iniciar sesión.
      - key: REQUERIR_EMAIL_VERIFICADO
        value: "false"
      # Sin esto el servidor usaría UTC y las ventas de la noche caerían
      # en el día siguiente. Ver app/core/fechas.py.
      - key: ZONA_HORARIA
        value: America/Bogota