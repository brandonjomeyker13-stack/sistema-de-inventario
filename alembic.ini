# alembic.ini — Configuración de las migraciones.
#
# Ojo: aquí NO se pone la cadena de conexión. `sqlalchemy.url` se deja
# vacío a propósito y migrations/env.py la toma de settings.DATABASE_URL,
# es decir de la variable de entorno. Así este archivo puede vivir en el
# repositorio sin filtrar la contraseña de la base, y las migraciones
# corren contra la base correcta en cada entorno sin tocar nada.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
